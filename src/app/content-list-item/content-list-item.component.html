
<div *ngIf="item" class="item-list">
  <h2>Item List</h2>
  <p><strong> ID: </strong>{{item.id}}</p>
  <p><strong> ProductName: </strong>{{item.productName | titlecase}}</p>
  <p><strong> Quantity: </strong>{{item.quantity}}</p>
  <p><strong> Color: </strong>{{item.color  | uppercase}}</p>
  <p><strong> Price: </strong>{{item.price | currency: 'CAD': "symbol-narrow"}}</p>
  <p><strong> Gift Wrap: </strong>{{item.giftWrap ? 'Yes':'No'}}</p>
</div>
<div *ngIf="error" class="error">{{ error }}</div>
