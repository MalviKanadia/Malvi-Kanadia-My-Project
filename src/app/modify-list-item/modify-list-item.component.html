<form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
    <div class="form-group" >
        <label for="id"  >ID</label>
        <input type="number" id="id" formControlName="id" [appHighlightOnFocus]="'grey'"  />
    </div>

    <div class="form-group">
        <label for="productName">Product Name</label>
        <input type="text" id="productName" formControlName="productName" [appHighlightOnFocus]="'grey'"  />
    </div>

    <div class="form-group">
        <label for="quantity">quantity</label>
        <input type="text" id="quantity" formControlName="quantity" [appHighlightOnFocus]="'grey'" />
    </div>

    <div class="form-group">
        <label for="color">Color</label>
        <input type="text" id="color" formControlName="color" [appHighlightOnFocus]="'grey'" />
    </div>
  <div class="form-group">
    <label for="price">Price</label>
    <input type="text" id="price" formControlName="price"[appHighlightOnFocus]="'grey'" />
  </div>

    <div class="form-group">
        <label for="giftWrap">Gift Wrap</label>
        <input type="checkbox" id="giftWrap" formControlName="giftWrap" [appHighlightOnFocus]="'grey'" />
    </div>

  <button type="submit" [appHighlightOnFocus]="'green'">Submit</button>
</form>
<div *ngIf="error" class="error">{{ error }}</div>
