<form [formGroup]="itemForm" (ngSubmit)="onSubmit()" class="mat-form">

  <mat-form-field appearance="outline" class="form-field" disabled>
    <mat-label>ID</mat-label>
    <input matInput type="number" formControlName="id" [appHighlightOnFocus]="'lightblue'"/>
  </mat-form-field>


  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Product Name</mat-label>
    <input matInput type="text" formControlName="productName"  [appHighlightOnFocus]="'lightblue'"/>
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Quantity</mat-label>
    <input matInput type="text" formControlName="qauntity" [appHighlightOnFocus]="'lightblue'" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Color</mat-label>
    <input matInput type="text" formControlName="color" [appHighlightOnFocus]="'lightblue'"/>
  </mat-form-field>


  <mat-form-field appearance="outline" class="form-field">
    <mat-label>Price</mat-label>
    <input matInput type="text" formControlName="price" [appHighlightOnFocus]="'lightblue'"/>
  </mat-form-field>

  <mat-checkbox formControlName="giftWrap" class="checkbox">giftWrap</mat-checkbox >

  <div class="button-group">
    <button mat-raised-button color="primary" type="submit" [appHoverHighlight]="'lightblue'">Submit</button>
  </div>

  <!-- Error Message -->
  <div *ngIf="error" class="error mat-error">{{ error }}</div>
</form>
